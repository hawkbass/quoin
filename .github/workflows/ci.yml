name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The arithmetic needs no browser and no network, so it runs first and fails
  # fast. Everything else is downstream of it being right.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run voice:check
      - run: npm run encoding:check
      - run: npm run test:unit
      - run: npm run build

  # The walk, the seater and the CSS export, in all three engines. These are the
  # tests that would have caught the export defect, so they gate the branch.
  browser:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test test/browser/verify.spec.ts test/browser/seat.spec.ts test/browser/export-css.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Downloads 30MB of fonts from a third party, so it is separated: a failure
  # here is a network failure or an upstream rename, not a defect in this
  # repository, and the two should not look the same on a pull request.
  metrics:
    runs-on: ubuntu-latest
    needs: unit
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run fonts
      - run: npx playwright test --project=chromium test/browser/cap-height.spec.ts test/browser/cross-engine.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findings
          path: findings/
          retention-days: 30
