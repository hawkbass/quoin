name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The arithmetic needs no browser and no network, so it runs first and fails
  # fast. Everything else is downstream of it being right.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run voice:check
      - run: npm run encoding:check
      - run: npm run workflows:check
      - run: npm run test:unit
      - run: npm run build

  # The walk, the seater and the CSS export, in all three engines. These are the
  # tests that would have caught the export defect, so they gate the branch.
  browser:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The extension suite loads a real Manifest V3 extension, which only
      # works in the newer headless build that `channel: "chromium"` selects.
      - run: npm run build:extension:test
      - run: npx playwright install --with-deps chromium chromium-headless-shell firefox webkit
      # Building the site seats it with its own tool and fails below 95% at any
      # breakpoint, so a change that knocks the page off the grid is caught here
      # rather than by somebody opening the console on it.
      - run: npm run build:site
      # Every spec that does not need the network. The manual ones skip
      # themselves; the font study runs in its own job.
      - run: npx playwright test --grep-invert "@network"
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The action, through its own composite interface rather than by running the
  # script directly.
  #
  # test/browser/action.spec.ts drives `node action/run.mjs` with the inputs as
  # environment variables, which is most of it and not all of it: the mapping in
  # action.yml from `inputs.widths` to QUOIN_WIDTHS is untested from inside, and
  # a typo there is invisible until somebody adds the action to a repository. So
  # this runs it the way a workflow does, against the real site, and then breaks
  # the page on purpose to prove the gate fires. A gate nobody has watched fail
  # is not a gate.
  action:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:site

      - name: Record a baseline for the built site
        uses: ./
        with:
          urls: /index.html
          directory: ./site/dist
          widths: "1280,900"
          baseline: .quoin-ci-baseline.json
          comment: "false"

      - name: The same page, unchanged, must find nothing
        uses: ./
        with:
          urls: /index.html
          directory: ./site/dist
          widths: "1280,900"
          baseline: .quoin-ci-baseline.json
          comment: "false"

      - name: Break the page on purpose
        run: |
          echo "" >> site/dist/style.css
          echo "section { border-top: 3px solid red; padding-top: 25px; }" >> site/dist/style.css

      - name: And now it has to fail
        id: broken
        continue-on-error: true
        uses: ./
        with:
          urls: /index.html
          directory: ./site/dist
          widths: "1280,900"
          baseline: .quoin-ci-baseline.json
          comment: "false"

      - name: A gate that does not fail is not a gate
        run: |
          if [ "${{ steps.broken.outcome }}" != "failure" ]; then
            echo "::error::the action passed a page it should have failed"
            exit 1
          fi
          echo "The gate fired, which is the point of it."

  # Downloads 30MB of fonts from a third party, so it is separated: a failure
  # here is a network failure or an upstream rename, not a defect in this
  # repository, and the two should not look the same on a pull request.
  metrics:
    runs-on: ubuntu-latest
    needs: unit
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run fonts
      - run: npx playwright test --project=chromium test/browser/cap-height.spec.ts test/browser/cross-engine.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findings
          path: findings/
          retention-days: 30
