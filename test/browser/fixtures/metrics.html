<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>quoin fixture: font metrics</title>
<style>
  /* Generic families and the two web-safe families that exist on every
     platform this suite runs on. Naming a webfont here would make the
     experiment a test of whether the font loaded. */
  html { font-family: serif; }
  body { margin: 0; font-size: 16px; }
  .specimen { font-size: 18px; line-height: 28px; }
</style>
</head>
<body>
  <p class="specimen">Hxp, the probe. H and x rather than O and o, because
  round letters overshoot the line they sit on.</p>
</body>
</html>
